name: Compilar Visor 3D para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
      - name: Validar proyecto
        run: |
          npm run check
          npm test
      - name: Instalar dependencias
        run: npm install
      - name: Compilar ejecutable e instaladores
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Visor-3D-Windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/release/visor3d.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
      - name: Guardar versiones utilizadas
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Visor-3D-dependency-locks
          path: |
            package-lock.json
            src-tauri/Cargo.lock
